###############################
#         Backend            #
###############################
backend = "glx";
vsync = true;
# glx-no-stencil = true;
# glx-no-rebind-pixmap = true;
use-damage = true;

###############################
#          Fading             #
###############################
# Hyprland'daki "fade" animasyonuna en yakın his: hızlı ve yumuşak geçiş
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 4;

fade-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'awesome'",
];

###############################
#           Blur              #
###############################
blur: {
    method = "dual_kawase";
    strength = 6;
    background = false;
    background-frame = false;
    background-fixed = false;
}

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'awesome'",
    "_GTK_FRAME_EXTENTS@:c"
];

###############################
#          Shadows            #
###############################
shadow = true;
shadow-radius = 16;
shadow-offset-x = -14;
shadow-offset-y = -14;
shadow-opacity = 0.55;
shadow-color = "#000000";

shadow-exclude = [
    "class_g = 'Polybar'",
    "class_g = 'awesome'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'"
];

###############################
#          Opacity            #
###############################
inactive-opacity = 0.94;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Rofi'"
];

opacity-rule = [
    "100:class_g = 'Polybar'",
    "100:class_g = 'awesome'",
    "95:class_g = 'kitty' && focused",
    "88:class_g = 'kitty' && !focused",
];

###############################
#     Genel / Diğer Ayarlar   #
###############################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
use-ewmh-active-win = true;
unredir-if-possible = false;
log-level = "warn";

wintypes:
{
    normal = { fade = true; shadow = true; };
    tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; full-shadow = false; };
    dock = { shadow = false; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.97; };
    dropdown_menu = { opacity = 0.97; };
};
