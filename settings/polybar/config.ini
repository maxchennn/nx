[colors]
background = #000000
background-alt = #1a1a1a
foreground = #e5e7eb
primary = #8b5cf6
secondary = #10b981
alert = #ef4444
disabled = #707880

[bar/main]
override-redirect = false
enable-struts = true
width = 100%
height = 28pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0
border-color = #00000000

padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=10;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"
font-2 = "JetBrainsMono Nerd Font:style=Black:size=17;3"

modules-left = launcher xworkspaces xwindow
modules-right = pulseaudio memory cpu wlan battery date sysupdate

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/launcher]
type = custom/text
format = " 󱄅 "
format-font = 3
format-foreground = ${colors.primary}
click-left = rofi -show drun

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "󰖁 muted"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <ramp-signal> <label-connected>
label-connected = %essid%

format-disconnected = <label-disconnected>
label-disconnected = "󰤮 disconnected"
label-disconnected-foreground = ${colors.disabled}

ramp-signal-0 = "󰤯"
ramp-signal-1 = "󰤟"
ramp-signal-2 = "󰤢"
ramp-signal-3 = "󰤥"
ramp-signal-4 = "󰤨"
ramp-signal-foreground = ${colors.primary}

[module/battery]
type = internal/battery
; ls /sys/class/power_supply/ ile kendi cihaz isimlerini kontrol et
battery = BAT0
adapter = ADP1
full-at = 99
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-charging-foreground = ${colors.secondary}
label-charging = %percentage%%

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

format-full = <ramp-capacity> <label-full>
label-full = %percentage%%

ramp-capacity-0 = "󰂎"
ramp-capacity-1 = "󰁻"
ramp-capacity-2 = "󰁽"
ramp-capacity-3 = "󰁿"
ramp-capacity-4 = "󰂀"
ramp-capacity-5 = "󰁹"
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = "󰢟"
animation-charging-1 = "󰢜"
animation-charging-2 = "󰂆"
animation-charging-3 = "󰂇"
animation-charging-4 = "󰂈"
animation-charging-5 = "󰢝"
animation-charging-6 = "󰂉"
animation-charging-7 = "󰢞"
animation-charging-8 = "󰂊"
animation-charging-9 = "󰂋"
animation-charging-10 = "󰂅"
animation-charging-framerate = 750

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = "󰥔 %date%"
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true
